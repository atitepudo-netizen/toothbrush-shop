<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrightSmile | แปรงสีฟัน</title>
<style>
  :root { --mint:#2bb3a3; --ink:#1f2d3d; --bg:#f4fbfa; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif; color:var(--ink); background:var(--bg); }
  header { background:linear-gradient(135deg,#2bb3a3,#6fd6c8); color:#fff; text-align:center; padding:56px 20px; }
  header h1 { margin:0 0 8px; font-size:2.2rem; }
  header p { margin:0; font-size:1.1rem; opacity:.95; }
  main { max-width:960px; margin:0 auto; padding:32px 16px 56px; }
  h2 { text-align:center; margin:0 0 24px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:20px; }
  .card { background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 4px 14px rgba(0,0,0,.08); display:flex; flex-direction:column; }
  .card img { width:100%; height:220px; object-fit:cover; background:#dff3f0; }
  .body { padding:16px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .sku { font-size:.8rem; color:#7a8a99; }
  .name { font-weight:700; font-size:1.1rem; }
  .price { font-size:1.4rem; color:var(--mint); font-weight:700; }
  .stock { font-size:.9rem; color:#5b6b7a; }
  button { margin-top:auto; border:0; background:var(--mint); color:#fff; padding:12px; border-radius:10px; font-size:1rem; cursor:pointer; }
  button:hover { filter:brightness(.95); }
  #msg { text-align:center; color:#7a8a99; }
  footer { text-align:center; padding:20px; color:#7a8a99; font-size:.9rem; }
</style>
</head>
<body>
<header>
  <h1>BrightSmile</h1>
  <p>แปรงสีฟันนุ่ม สะอาด ยิ้มมั่นใจทุกวัน</p>
</header>
<main>
  <h2>สินค้าของเรา</h2>
  <p id="msg">กำลังโหลดสินค้า...</p>
  <div class="grid" id="grid"></div>
</main>
<footer>© BrightSmile · สั่งซื้อทางแชท/ไลน์</footer>

<script>
const SHEET_ID = "1V-xJLH755A-EXXXZMociIONka_Xr9-4lQZEeJ071-XA";
const URL_CSV = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

function parseCSV(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i+1] === '"') { cur += '"'; i++; }
      else if (c === '"') q = false;
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
    else if (c !== "\r") cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

fetch(URL_CSV).then(r => r.text()).then(t => {
  const rows = parseCSV(t).slice(1).filter(r => r[0]);
  const grid = document.getElementById("grid");
  document.getElementById("msg").style.display = "none";
  rows.forEach(([sku, name, price, stock, img]) => {
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `
      <img src="รูปแยก/${img}" alt="${name}" onerror="this.src='https://placehold.co/400x300/dff3f0/2bb3a3?text=${encodeURIComponent(sku)}'">
      <div class="body">
        <span class="sku">${sku}</span>
        <span class="name">${name}</span>
        <span class="price">฿${price}</span>
        <span class="stock">คงเหลือ ${stock} ชิ้น</span>
        <button onclick="alert('สั่งซื้อ ${sku} สำเร็จ (ตัวอย่าง)')">สั่งซื้อ</button>
      </div>`;
    grid.appendChild(el);
  });
}).catch(() => {
  document.getElementById("msg").textContent = "โหลดข้อมูลไม่สำเร็จ ตรวจสอบว่า Sheet แชร์เป็น 'ทุกคนที่มีลิงก์' แล้ว";
});
</script>
</body>
</html>
